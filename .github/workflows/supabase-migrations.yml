name: Supabase migrations

# Автоматично пуска чакащите SQL миграции от property-platform/supabase/migrations
# към живата Supabase база всеки път, когато такъв файл стигне до deploy branch-а.
# Преди това е ставало ръчно (Supabase Dashboard -> SQL Editor -> paste -> Run) и
# лесно се пропускаше — кодът излизаше в production, но данните/схемата не.

on:
  push:
    branches:
      - claude/ai-autonomous-trader-crypto-etf-anstj4
    paths:
      - "property-platform/supabase/migrations/**"
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: property-platform
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      # ЕДНОКРАТНО: 0001-0013 вече бяха пуснати ръчно преди тази автоматизация
      # съществуваше, но Supabase's remote history не го знае — без този ред
      # `db push` се опитва да ги приложи пак от нулата и гърми на "вече
      # съществува". Маркира ги като приложени, без да ги изпълнява отново.
      # Ще махнем тази стъпка в следващ commit, след като мине веднъж чисто.
      - name: Mark pre-automation migrations as already applied
        run: |
          supabase migration repair --status applied \
            0001 0002 0003 0004 0005 0006 0007 0008 0009 0010 0011 0012 0013
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push pending migrations
        run: supabase db push -y
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
