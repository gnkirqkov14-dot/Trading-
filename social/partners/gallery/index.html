<title>Партньорски материали PHOMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: inbox of partner posts — sticky toolbar (tabs + partner chips), responsive card grid, one action row per card */
:root{
  --bg:#f3f2ef; --surface:#ffffff; --fg:#1d1f1e; --muted:#6b6f6c; --line:#dcdad4;
  --accent:#2f5d50; --accent-fg:#ffffff; --accent-soft:#e2ece8;
  --skip:#8a6d3b; --done:#3d5a99; --done-soft:#e3e9f6;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151716; --surface:#1f2221; --fg:#ecedea; --muted:#9ba09c; --line:#323634;
  --accent:#7fb5a3; --accent-fg:#0f1714; --accent-soft:#22332d;
  --skip:#c9a76b; --done:#9db4ea; --done-soft:#232a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151716; --surface:#1f2221; --fg:#ecedea; --muted:#9ba09c; --line:#323634;
  --accent:#7fb5a3; --accent-fg:#0f1714; --accent-soft:#22332d;
  --skip:#c9a76b; --done:#9db4ea; --done-soft:#232a3a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;padding:0 16px 48px}
.wrap{max-width:1180px;margin:0 auto}
header{padding-block:28px 12px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(20px,3.2vw,28px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.stats{display:flex;gap:16px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.stats b{color:var(--fg);font-weight:600}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.tabs,.chips,.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kind{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 14px;cursor:pointer}
.kind[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.info{grid-column:1/-1;background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:14px;max-width:none}
.info b{font-weight:600}
.tab,.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.tab .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.media{position:relative;aspect-ratio:4/5;background:var(--line);max-width:100%}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;top:8px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:rgba(0,0,0,.62);color:#fff;border-radius:4px;padding:3px 6px}
.state{position:absolute;right:8px;top:8px;font-size:11px;font-weight:600;border-radius:4px;padding:3px 6px}
.state.selected{background:var(--accent);color:var(--accent-fg)}
.state.done{background:var(--done);color:var(--bg)}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.who{font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap{font-size:13px;color:var(--fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cap.open{-webkit-line-clamp:unset}
.cap:empty::before{content:"Без текст";color:var(--muted)}
.more{font:inherit;font-size:12px;background:none;border:0;color:var(--muted);padding:0;cursor:pointer;align-self:flex-start;text-decoration:underline}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:8px 10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);flex:1}
.btn.pick{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pick[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
.open-ig{font-size:12px;color:var(--muted)}
.file .media{aspect-ratio:auto;background:#000}
.file .media img,.file .media video{width:100%;height:auto;max-height:520px;object-fit:contain;display:block}
.fnote{font-size:12px;color:var(--muted)}
.empty{grid-column:1/-1;padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
.runbar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px}
.runbar .btn{flex:0 0 auto;padding:10px 16px}
.runbar .st{font-size:13px;color:var(--fg);min-width:0}
.note{font-size:12px;color:var(--muted);padding-top:18px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s,box-shadow .15s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Партньорски материали</h1>
      <p class="sub">Нови постове от Instagram на партньорите. Маркирай „Избирам“ на това, което искаш. Само избраното се сваля в пълно качество и се почиства от надписи.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="bar">
    <div class="tabs" id="tabs" role="group" aria-label="Статус"></div>
    <div class="kinds" id="kinds" role="group" aria-label="Вид"></div>
    <div class="chips" id="chips" role="group" aria-label="Партньор"></div>
  </div>

  <main class="grid" id="grid">
    <div class="empty">Зареждане на постовете…</div>
  </main>
  <p class="note" id="note"></p>
</div>

<script>
const TABS=[["new","Нови"],["selected","Избрани"],["done","Обработени"],["skipped","Пропуснати"],["all","Всички"]];
const TYPE={video:"Видео",carousel:"Галерия",image:"Снимка"};
let rows=[], dl=null, mcp=null, metaRef=null, proc=null, procBusy=false, procErr="", tab="new", partner="all", kind="all", dbRef=null, busy=new Set();
try{ tab=localStorage.getItem("tab")||"new"; partner=localStorage.getItem("partner")||"all"; kind=localStorage.getItem("kind")||"all"; }catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=d=>{ if(!d) return ""; const [y,m,dd]=d.split("-"); return `${dd}.${m}.${y}`; };

const isVideo=r=>r.type==="video";
const kindOk=r=>kind==="all"||(kind==="video"?isVideo(r):!isVideo(r));
function counts(){ const v=rows.filter(kindOk); const c={new:0,selected:0,done:0,skipped:0,all:v.length}; v.forEach(r=>c[r.status]=(c[r.status]||0)+1); return c; }

function renderBars(){
  const c=counts();
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab" data-tab="${k}" aria-pressed="${tab===k}">${l}<span class="n">${c[k]||0}</span></button>`).join("");
  const kc={all:rows.length,photo:rows.filter(r=>!isVideo(r)).length,video:rows.filter(isVideo).length};
  $("#kinds").innerHTML=[["all","Всичко"],["photo","Само снимки"],["video","Само видеа"]].map(([k,l])=>`<button class="kind" data-kind="${k}" aria-pressed="${kind===k}">${l} <span class="n">${kc[k]}</span></button>`).join("");
  const ps=[...new Map(rows.map(r=>[r.partner,r.country])).entries()].sort();
  $("#chips").innerHTML=`<button class="chip" data-p="all" aria-pressed="${partner==="all"}">Всички партньори</button>`+
    ps.map(([p,c])=>`<button class="chip" data-p="${esc(p)}" aria-pressed="${partner===p}">@${esc(p)} · ${esc(c)}</button>`).join("");
  $("#stats").innerHTML=`<span><b>${c.new}</b> нови</span><span><b>${c.selected}</b> избрани</span><span><b>${rows.length}</b> общо</span>`;
}

function card(r){
  const sel=r.status==="selected", done=r.status==="done";
  const typ=r.type==="carousel"?`${r.count} снимки`:TYPE[r.type]||"";
  return `<article class="card${sel?" sel":""}" data-id="${esc(r.id)}">
    <div class="media"><img src="${esc(r.thumb)}" alt="Пост на @${esc(r.partner)}" loading="lazy">
      <span class="badge">${esc(typ)}</span>
      ${sel?'<span class="state selected">Избрано</span>':""}${done?'<span class="state done">Обработено</span>':""}
    </div>
    <div class="body">
      <div class="meta"><span class="who">@${esc(r.partner)}</span><span>${fmtDate(r.date)}</span></div>
      <div class="cap" id="cap-${esc(r.id)}">${esc(r.caption)}</div>
      ${r.caption&&r.caption.length>120?`<button class="more" data-more="${esc(r.id)}">Още</button>`:""}
      <a class="open-ig" href="${esc(r.url)}" target="_blank" rel="noopener">Отвори в Instagram ↗</a>
      <div class="acts">
        <button class="btn pick" data-act="pick" aria-pressed="${sel||done}" ${done||busy.has(r.id)||!dbRef?"disabled":""}>${sel?"Избрано ✓":done?"Готово":"Избирам"}</button>
        <button class="btn" data-act="skip" ${done||busy.has(r.id)||!dbRef?"disabled":""}>${r.status==="skipped"?"Върни":"Пропусни"}</button>
      </div>
    </div>
  </article>`;
}

function fileCard(r,f){
  const src="/_blob/"+encodeURIComponent(f.id);
  const media=f.kind==="video"?`<video src="${src}" controls preload="metadata" playsinline></video>`:`<img src="${src}" alt="${esc(f.name)}" loading="lazy">`;
  return `<article class="card file">
    <div class="media">${media}</div>
    <div class="body">
      <div class="meta"><span class="who">@${esc(r.partner)} · ${esc(r.country)}</span><span>${fmtDate(r.date)}</span></div>
      ${f.note?`<div class="fnote">${esc(f.note)}</div>`:""}
      <a class="open-ig" href="${esc(r.url)}" target="_blank" rel="noopener">Оригиналът в Instagram ↗</a>
      <div class="acts"><button class="btn pick" data-dl="${esc(f.id)}" data-name="${esc(f.name)}" ${dl?"":"disabled"}>Изтегли ${f.kind==="video"?"видеото":"снимката"}</button></div>
    </div>
  </article>`;
}

function procText(){
  if(procErr) return procErr;
  if(!proc||!proc.status) return "";
  const t=proc.requestedAt?new Date(proc.requestedAt).toLocaleTimeString("bg-BG",{hour:"2-digit",minute:"2-digit"}):"";
  if(proc.status==="requested") return `Заявено в ${t}. Обработва се, след няколко минути файловете ще са в „Обработени“.`;
  if(proc.status==="done") return `Последна обработка: ${proc.doneAt?new Date(proc.doneAt).toLocaleString("bg-BG",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):""}${proc.count!=null?` · ${proc.count} файла`:""}.`;
  return "";
}
function runBar(n){
  const pending=proc&&proc.status==="requested"&&proc.requestedAt&&(Date.now()-Date.parse(proc.requestedAt)<30*60e3);
  const dis=!n||procBusy||pending||!mcp;
  const label=procBusy?"Изпращам…":pending?"Обработва се…":`Обработи сега (${n})`;
  const st=!mcp?"Бутонът работи, когато страницата е отворена в claude.ai. Иначе пиши в чата „обработи избраните“.":procText();
  return `<div class="runbar"><button class="btn pick" data-run ${dis?"disabled":""}>${label}</button><span class="st" role="status">${esc(st)}</span></div>`;
}

function render(){
  renderBars();
  const list=rows.filter(r=>(tab==="all"||r.status===tab)&&(partner==="all"||r.partner===partner)&&kindOk(r));
  const info=tab==="selected"?runBar(list.length)+`<div class="info">Натисни „Обработи сега“ и избраните постове се свалят в пълно качество и се почистват от лога и надписи. След няколко минути са в „Обработени“, откъдето ги сваляш. Ако не натиснеш нищо, се обработват автоматично утре в 07:53. Ако размислиш за пост, натисни „Избрано ✓“ и той се връща в „Нови“.</div>`:"";
  if(tab==="done"){
    const files=list.flatMap(r=>(r.files||[]).map(f=>[r,f]));
    const head=`<div class="info"><b>Това е папката с готовия материал.</b> Тук са изчистените снимки и видеа от избраните постове, в пълно качество. Натисни „Изтегли“ под файла, за да го запазиш.</div>`;
    $("#grid").innerHTML=head+(files.length?files.map(([r,f])=>fileCard(r,f)).join(""):`<div class="empty">Още няма обработени файлове. Избраните постове се обработват всяка сутрин в 07:53.</div>`);
    return;
  }
  $("#grid").innerHTML=info+(list.length?list.map(card).join(""):
    `<div class="empty">${rows.length?"Няма постове тук.":"Още няма постове. Всяка сутрин тук се добавят новите постове на партньорите."}</div>`);
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab]"); if(t){ tab=t.dataset.tab; try{localStorage.setItem("tab",tab)}catch(_){}; render(); return; }
  const d=e.target.closest("[data-dl]"); if(d){ if(!dl) return; const old=d.textContent; d.disabled=true; d.textContent="Подготвям…";
    try{ const b=await (await fetch("/_blob/"+encodeURIComponent(d.dataset.dl))).blob(); await dl.save({filename:d.dataset.name,data:b}); d.textContent="Изтеглено ✓"; }
    catch(err){ d.textContent=err&&err.code==="declined"?old:"Неуспешно, опитай пак"; }
    finally{ d.disabled=false; } return; }
  const k=e.target.closest("[data-kind]"); if(k){ kind=k.dataset.kind; try{localStorage.setItem("kind",kind)}catch(_){}; render(); return; }
  const p=e.target.closest("[data-p]"); if(p){ partner=p.dataset.p; try{localStorage.setItem("partner",partner)}catch(_){}; render(); return; }
  const m=e.target.closest("[data-more]"); if(m){ const c=document.getElementById("cap-"+m.dataset.more); c.classList.toggle("open"); m.textContent=c.classList.contains("open")?"По-малко":"Още"; return; }
  const run=e.target.closest("[data-run]"); if(run){ if(!mcp||procBusy) return; procBusy=true; procErr=""; render();
    const n=rows.filter(r=>r.status==="selected").length;
    try{
      await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:"trig_011H7DZv2z9tnTJDqNEoUNk7",
        text:`Заявка от бутона „Обработи сега“ в галерията (${n} избрани). Пропусни стъпки 1 и 2 (без fetch). Направи само стъпки 3 и 4: обработи избраните сега. Накрая обнови документа meta/process в базата на артефакта: status "done", doneAt и count (брой обработени файлове).`});
      const req={status:"requested",requestedAt:new Date().toISOString(),count:n};
      proc=req; if(metaRef) metaRef.set(req).catch(()=>{});
    }catch(err){ procErr=err&&err.code==="consent_required"||err&&err.code==="not_granted"?"Трябва да разрешиш връзката с Claude Code Remote, за да работи бутонът.":"Заявката не мина. Пиши в чата „обработи избраните“."; }
    finally{ procBusy=false; render(); } return; }
  const a=e.target.closest("[data-act]"); if(!a||!dbRef) return;
  const id=a.closest(".card").dataset.id, r=rows.find(x=>x.id===id); if(!r||busy.has(id)) return;
  let next = a.dataset.act==="pick" ? (r.status==="selected"?"new":"selected") : (r.status==="skipped"?"new":"skipped");
  busy.add(id); render();
  try{ await dbRef.doc(id).update({status:next, changedAt:new Date().toISOString()}); }
  catch(err){ $("#note").textContent="Промяната не се запази. Провери връзката и опитай пак."; }
  finally{ busy.delete(id); render(); }
});

render();
(async()=>{
  const db = window.claude ? await claude.use("db") : null;
  if(!db){ $("#grid").innerHTML='<div class="empty">Влез в claude.ai, за да виждаш и избираш постове.</div>'; return; }
  dbRef=db.collection("posts");
  claude.use("downloads").then(x=>{ dl=x; render(); });
  claude.use("mcp").then(x=>{ mcp=x; render(); });
  metaRef=db.collection("meta").doc("process");
  metaRef.onSnapshot(d=>{ proc=d.exists?d.data():null; render(); },()=>{});
  dbRef.orderBy("date","desc").onSnapshot(s=>{ rows=s.docs.map(d=>({id:d.id,...d.data()})); render(); },
    ()=>{ $("#note").textContent="Връзката с данните прекъсна. Презареди страницата."; });
})();
</script>
