<title>PHOMI контакти</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: списък с контакти вляво, профил на избрания контакт вдясно (на телефон – профилът е отделен изглед) */
:root {
  --bg: #eef1f1; --surface: #ffffff; --surface-2: #f5f8f8; --ink: #1a2224; --muted: #5a676b; --line: #d5dcdd;
  --accent: #0e6a70; --accent-ink: #ffffff; --accent-soft: #dcefef;
  --warn: #c2410c; --ok: #3c7a36; --gold: #a86a12;
  --st-none: #e7ebeb; --st-try: #fdf0d5; --st-later: #ece4fb; --st-int: #dcf2d6; --st-meet: #bfe5b2; --st-offer: #d9e8fb; --st-no: #e3e3e3;
  --mail: #ff7a00; --st-mail: #ff7a00; --mail-ink: #ffffff; --mail-soft: #fff0e0;
  --meet: #1f9d3a; --meet-ink: #ffffff; --meet-soft: #dcf5e1;
  --font-body: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111718; --surface: #182022; --surface-2: #1e2729; --ink: #e5ecec; --muted: #9aa8ab; --line: #2b3537;
  --accent: #4fb5ba; --accent-ink: #0b1213; --accent-soft: #173638;
  --warn: #f08a5d; --ok: #85c47a; --gold: #e2b05a;
  --st-none: #232c2e; --st-try: #3a3220; --st-later: #332a45; --st-int: #213a22; --st-meet: #2c4d27; --st-offer: #1f3047; --st-no: #2a2f30;
  --mail: #ff8a1f; --st-mail: #ff8a1f; --mail-ink: #1a1000; --mail-soft: #3d2410;
  --meet: #3cc45d; --meet-ink: #06200d; --meet-soft: #173a20;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111718; --surface: #182022; --surface-2: #1e2729; --ink: #e5ecec; --muted: #9aa8ab; --line: #2b3537;
  --accent: #4fb5ba; --accent-ink: #0b1213; --accent-soft: #173638;
  --warn: #f08a5d; --ok: #85c47a; --gold: #e2b05a;
  --st-none: #232c2e; --st-try: #3a3220; --st-later: #332a45; --st-int: #213a22; --st-meet: #2c4d27; --st-offer: #1f3047; --st-no: #2a2f30;
  --mail: #ff8a1f; --st-mail: #ff8a1f; --mail-ink: #1a1000; --mail-soft: #3d2410;
  --meet: #3cc45d; --meet-ink: #06200d; --meet-soft: #173a20;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; display: grid; gap: 12px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; justify-content: space-between; }
header h1 { font: 600 clamp(20px, 4vw, 26px)/1.15 var(--font-display); margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.save-note.warn { color: var(--warn); }
.btn { font: 600 14px var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 8px 14px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--warn); }
.btn:disabled { opacity: .5; cursor: default; }
.mini { font: 500 12px var(--font-body); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  border-radius: 6px; padding: 2px 8px; cursor: pointer; text-decoration: none; }
.mini:hover { border-color: var(--accent); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px;
  font: 600 14px var(--font-body); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tab .n { font-weight: 500; opacity: .8; margin-left: 4px; font-variant-numeric: tabular-nums; }
.tab .n.over { background: var(--warn); color: var(--surface); border-radius: 999px; padding: 0 6px; opacity: 1; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; }
.toolbar label, .form label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
input, select, textarea { font: 14px var(--font-body); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 9px; min-width: 0; width: 100%; }
textarea { resize: vertical; }
.toolbar .grow { flex: 1 1 220px; }
.check { display: flex !important; align-items: center; gap: 6px !important; font-size: 14px !important; color: var(--ink) !important;
  padding-bottom: 7px; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.count { color: var(--muted); font-size: 13px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; align-items: start; }
.list { display: grid; gap: 6px; }
.row { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; cursor: pointer; text-align: left; color: var(--ink);
  font: inherit; width: 100%; position: relative; }
.row .rowdel { position: absolute; right: 6px; bottom: 4px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px;
  color: var(--muted); font-size: 17px; line-height: 1; }
.row .rowdel:hover { color: #fff; background: #c2410c; }
.row .rowdel-ask { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end;
  font-size: 13px; padding-top: 4px; border-top: 1px dashed var(--line); }
.mini.danger { background: #c2410c; border-color: #c2410c; color: #fff; }
.row:hover { border-color: var(--accent); }
.row[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: -1px; }
.row .nm { font-weight: 600; overflow-wrap: anywhere; }
.row .grip { display: inline-block; cursor: grab; touch-action: none; user-select: none; color: var(--muted); padding: 0 6px 0 0; font-size: 16px; }
.row.dragging { opacity: .85; border-color: var(--accent); box-shadow: 0 6px 18px rgba(0,0,0,.18); cursor: grabbing; }
body.reordering { user-select: none; cursor: grabbing; }
.row .no { color: var(--muted, #6b7678); font-weight: 700; font-variant-numeric: tabular-nums; }
.row .when { grid-row: 1 / 3; display: grid; justify-items: center; min-width: 54px; padding-right: 10px; border-right: 1px solid var(--line);
  font: 600 13px var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
.row .when small { font: 500 10px var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.row .sub { grid-column: 3 / 5; color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 2px 10px; }
.row .sub .ph { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); }
.star { font-size: 18px; line-height: 1; color: var(--line); background: none; border: 0; cursor: pointer; padding: 2px; }
.star[aria-pressed="true"] { color: var(--gold); }
.chipwrap { display: inline-flex; align-items: center; gap: 6px; justify-self: end; }
.thought { position: relative; cursor: help; font-size: 15px; line-height: 1; }
.thought .bubble { display: none; position: absolute; right: -6px; top: calc(100% + 8px); z-index: 20; width: min(320px, 80vw);
  background: var(--surface); color: var(--ink); border: 1px solid var(--accent); border-radius: 12px; padding: 9px 11px;
  box-shadow: 0 8px 22px rgba(0,0,0,.18); font: 400 13px/1.45 var(--font-body); white-space: pre-wrap; text-align: left; cursor: default; }
.thought .bubble b { display: block; font-weight: 700; color: var(--accent); margin-bottom: 3px; font-size: 12px; }
.thought .bubble::before { content: ""; position: absolute; right: 10px; top: -7px; width: 12px; height: 12px; background: var(--surface);
  border-left: 1px solid var(--accent); border-top: 1px solid var(--accent); transform: rotate(45deg); }
.thought:hover .bubble, .thought:focus .bubble { display: block; }
.chip { font-size: 11.5px; border-radius: 999px; padding: 2px 8px; border: 1px solid var(--line); white-space: nowrap; }
.due { color: var(--warn); font-weight: 600; }
.late { color: var(--gold); font-weight: 600; }
.mailbox { border: 2px solid var(--accent); border-radius: 10px; padding: 12px; display: grid; gap: 10px; background: var(--surface); }
.mailbox iframe { width: 100%; height: 560px; border: 1px solid var(--line); border-radius: 8px; background: #ffffff; }
.mailbox .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
/* „Чака да изпратим имейл“ – ярко оранжево, за да напомня */
.row.mail-due { background: var(--mail-soft); border-color: var(--mail); border-left: 6px solid var(--mail); }
.chip[style*="--st-mail"] { color: var(--mail-ink); font-weight: 700; border-color: var(--mail); }
/* „Уговорена среща“ – целият ред зелен */
.row.meet-due { background: var(--meet-soft); border-color: var(--meet); border-left: 6px solid var(--meet); }
.row.meet-due .chip { background: var(--meet) !important; color: var(--meet-ink); font-weight: 700; border-color: var(--meet); }
.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px;
  position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); max-height: calc(100vh - 24px); overflow: auto; min-width: 0; }
.profile h2 { margin: 0; font: 600 19px/1.25 var(--font-display); overflow-wrap: anywhere; text-wrap: balance; }
.phead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; align-items: start; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.back { display: none; }
.lines { display: grid; gap: 5px; }
.line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; min-width: 0; }
.val { font-family: var(--font-mono); font-size: 14px; user-select: all; overflow-wrap: anywhere; min-width: 0; }
.note { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.status-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; border-top: 1px dashed var(--line); padding-top: 10px; }
.status-row label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); flex: 1 1 200px; }
section h3 { margin: 0 0 6px; font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.entry { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 10px; display: grid; gap: 3px;
  background: var(--surface-2); min-width: 0; }
.entry.over { border-left-color: var(--warn); } .entry.done { opacity: .6; }
.entry .em { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.entry .said { white-space: pre-wrap; overflow-wrap: anywhere; }
.entry .nx { font-weight: 600; } .entry.over .nx { color: var(--warn); }
.log { display: grid; gap: 6px; }
.form { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; }
.form label { flex: 1 1 200px; }
.form label.wide { flex-basis: 100%; }
.form label.short { flex: 0 1 170px; }
.form .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.msg { font-size: 12.5px; color: var(--muted); min-height: 1em; }
.msg.err { color: var(--warn); }
.empty { color: var(--muted); text-align: center; padding: 30px 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; }
.confirm { background: var(--st-try); border-radius: 8px; padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); width: min(640px, calc(100% - 32px));
  padding: 16px; }
dialog::backdrop { background: rgba(0, 0, 0, .35); }
dialog h2 { margin: 0 0 10px; font: 600 18px var(--font-display); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
footer { color: var(--muted); font-size: 12.5px; }
@media (max-width: 860px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .main.showing .list-col { display: none; }
  .main:not(.showing) .profile { display: none; }
  .profile { position: static; max-height: none; }
  .back { display: inline-block; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>PHOMI контакти</h1>
      <p class="save-note" id="saveNote">Контактите се зареждат…</p>
    </div>
    <button class="btn primary" id="addBtn" type="button">+ Нов контакт</button>
  </header>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="all" aria-selected="true">Контакти<span class="n" id="nAll">0</span></button>
    <button class="tab" role="tab" data-tab="inq" aria-selected="false">Запитвания<span class="n" id="nInq">0</span></button>
    <button class="tab" role="tab" data-tab="pick" aria-selected="false">★ Избрани<span class="n" id="nPick">0</span></button>
    <button class="tab" role="tab" data-tab="rem" aria-selected="false">Напомняния<span class="n" id="nRem">0</span></button>
  </nav>

  <div class="toolbar" role="search">
    <label class="grow" for="q">Търсене (фирма, лице, телефон, бележка)
      <input type="search" id="q" placeholder="напр. Студио, Каменица, 088…" autocomplete="off"></label>
    <label for="city">Град
      <select id="city"><option value="">Всички</option></select></label>
    <label for="kind">Вид
      <select id="kind"><option value="">Всички</option></select></label>
    <label for="stf">Статус
      <select id="stf"><option value="">Всички</option></select></label>
  </div>

  <div class="bar">
    <span class="count" id="count"></span>
    <span class="line">
      <button class="mini" id="copyPhones" type="button">Копирай телефоните на показаните</button>
      <button class="mini" id="copyMails" type="button">Копирай имейлите на показаните</button>
      <span class="msg" id="bulkMsg"></span>
    </span>
  </div>

  <div class="main" id="main">
    <div class="list-col"><div class="list" id="list"></div></div>
    <aside class="profile" id="profile" aria-live="polite"></aside>
  </div>

  <footer>Всичко, което пишеш тук, се записва автоматично и се вижда на всичките ти устройства.</footer>
</div>

<dialog id="contactDlg">
  <form id="contactForm" class="form" method="dialog">
    <h2 id="dlgTitle" style="flex-basis:100%">Нов контакт</h2>
    <label class="wide" for="f-name">Фирма / бюро *<input id="f-name" required autocomplete="off"></label>
    <label for="f-kind">Вид<select id="f-kind"></select></label>
    <label for="f-city">Град<input id="f-city" list="cityList" autocomplete="off" placeholder="Пловдив"></label>
    <label for="f-person">Лице за контакт<input id="f-person" autocomplete="off"></label>
    <label for="f-phones">Телефон(и) – със запетая<input id="f-phones" autocomplete="off" placeholder="+359 88 123 4567"></label>
    <label for="f-emails">Имейл(и) – със запетая<input id="f-emails" autocomplete="off"></label>
    <label for="f-site">Сайт<input id="f-site" autocomplete="off" placeholder="https://"></label>
    <label class="wide" for="f-address">Адрес<input id="f-address" autocomplete="off"></label>
    <label class="wide" for="f-note">Бележка (обект, откъде е контактът)<textarea id="f-note" rows="2"></textarea></label>
    <div class="actions" style="flex-basis:100%">
      <button class="btn primary" id="saveContact" type="submit">Запази</button>
      <button class="btn" id="cancelContact" type="button">Откажи</button>
      <span class="msg" id="formMsg"></span>
    </div>
  </form>
</dialog>
<datalist id="cityList"></datalist>

<script>
(function () {
  "use strict";
  const STATUSES = ["Не е звъняно", "Звъннато – няма отговор", "Да звънна пак", "Разговор – интерес", "Чака да изпратим имейл", "Изпратен имейл",
                    "Уговорена среща", "Проведена среща",
                    "Изпратена оферта", "Не се интересува", "Грешен номер"];
  const ST_BG = {"Не е звъняно": "--st-none", "Звъннато – няма отговор": "--st-try", "Да звънна пак": "--st-later", "Разговор – интерес": "--st-int",
                 "Чака да изпратим имейл": "--st-mail", "Изпратен имейл": "--st-offer",
                 "Уговорена среща": "--st-meet", "Проведена среща": "--st-meet", "Изпратена оферта": "--st-offer",
                 "Не се интересува": "--st-no", "Грешен номер": "--st-no"};
  const KINDS = ["Архитект", "Клиент", "Инвеститор", "Строител", "Надзор", "Проектант", "Друго"];
  // Раздел „Запитвания“: контакти с group "inq" (запитвания от сайта/имейл), отделно от архитектите
  const isInq = (c) => c.group === "inq";
  const LOG_KINDS = ["Обаждане", "Среща", "Имейл", "Оглед"];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

  // На телефона: нов имейл направо в приложението Gmail (iPhone – googlegmail://, Android – intent към Gmail)
  const UA = navigator.userAgent || "";
  const IOS = /iPhone|iPad|iPod/i.test(UA), ANDROID = /Android/i.test(UA);
  function gmailApp(addr) {
    if (IOS) return "googlegmail:///co?to=" + encodeURIComponent(addr);
    if (ANDROID) return "intent:" + encodeURIComponent(addr).replace(/%40/g, "@") + "#Intent;scheme=mailto;package=com.google.android.gm;end";
    return "";
  }
  function appBtn(addr) {
    const u = gmailApp(addr);
    return u ? `<a class="mini" href="${esc(u)}" target="_blank" rel="noopener">Gmail приложение</a>` : "";
  }
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* без запомняне */ } } };
  const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const fmtDay = (iso) => iso ? iso.slice(8, 10) + "." + iso.slice(5, 7) + "." + iso.slice(0, 4) : "";
  const fmtAt = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleDateString("bg-BG", {day: "2-digit", month: "2-digit", year: "numeric"}) +
    " " + d.toLocaleTimeString("bg-BG", {hour: "2-digit", minute: "2-digit"}); };
  const split = (v) => String(v || "").split(/[,;]/).map((x) => x.trim()).filter(Boolean);

  const contacts = {}, logs = {};
  let db = null, mode = "loading", readOnly = false, loaded = false;
  let tab = "all", current = store.get("phomi-c-current") || "", editing = null, confirmDel = null, mailOpen = null, mailBusy = false, mailDraft = null;
  let mcp = null, mailerUrl = "";
  const MAILER_KEY = "JPyiDWlI4wi4Foj71WRMDxci";  // същият ключ е в email/phomi_mailer.gs

  $("#stf").innerHTML += STATUSES.map((s) => `<option>${esc(s)}</option>`).join("");
  $("#kind").innerHTML += KINDS.map((s) => `<option>${esc(s)}</option>`).join("");
  $("#f-kind").innerHTML = KINDS.map((s) => `<option>${esc(s)}</option>`).join("");

  // ---------- изчисления ----------
  const statusOf = (c) => c.status || "Не е звъняно";
  function entriesFor(id) { return Object.keys(logs).filter((k) => logs[k].contact === id).sort((a, b) => (logs[b].at || "").localeCompare(logs[a].at || "")); }
  function openSteps() { return Object.keys(logs).filter((k) => !logs[k].done && (logs[k].next || logs[k].due) && contacts[logs[k].contact])
    .sort((a, b) => (logs[a].due || "9999").localeCompare(logs[b].due || "9999")); }
  // имейл без отговор: дни от изпращането, докато статусът още е „Изпратен имейл“
  const FOLLOW_DAYS = 7;
  function mailDays(c) {
    if (statusOf(c) !== "Изпратен имейл" || !c.emailSent) return null;
    return Math.floor((Date.parse(today()) - Date.parse(c.emailSent)) / 864e5);
  }
  function followUps() { return Object.keys(contacts).filter((i) => (mailDays(contacts[i]) ?? -1) >= FOLLOW_DAYS)
    .sort((a, b) => contacts[a].emailSent.localeCompare(contacts[b].emailSent)); }
  function mailTag(c) {
    const d = mailDays(c);
    if (d == null) return "";
    if (d >= FOLLOW_DAYS) return `<span class="${d >= 14 ? "due" : "late"}">без отговор ${d} дни – потърси пак</span>`;
    return `<span>имейл преди ${d === 0 ? "по-малко от ден" : d + (d === 1 ? " ден" : " дни")}</span>`;
  }
  // последно действие: запис в дневника, смяна на статус, изпратен имейл или промяна в бележката
  function lastAction(id) {
    const c = contacts[id];
    // добавянето на контакта не се брои – само нещата, които си направил с него
    // статус, сменен без записан час (от по-стара версия на страницата) – взима се часът на последната промяна
    const statusTime = c.statusAt || (statusOf(c) !== "Не е звъняно" ? c.updated : "");
    return [lastTalk(id), statusTime, c.emailSent, c.noteAt].filter(Boolean).sort().pop() || "";
  }
  function whenText(iso) {
    if (!iso) return {short: "—", long: "няма действие"};
    const d = Math.floor((Date.parse(today()) - Date.parse(iso.slice(0, 10))) / 864e5);
    const day = fmtDay(iso.slice(0, 10));
    return {short: d <= 0 ? "днес" : d === 1 ? "вчера" : day.slice(0, 5), long: d <= 0 ? "днес" : d === 1 ? "вчера" : `${day} (преди ${d} дни)`, days: d};
  }
  function nextDue(id) { const d = entriesFor(id).map((k) => logs[k]).filter((e) => !e.done && e.due).map((e) => e.due).sort(); return d[0] || ""; }
  function lastTalk(id) { const e = entriesFor(id)[0]; return e ? logs[e].at : ""; }

  function matches(id) {
    const c = contacts[id], q = $("#q").value.trim().toLowerCase();
    if (tab === "pick" && !c.pick) return false;
    if (tab === "inq" && !isInq(c)) return false;
    if (tab === "all" && isInq(c)) return false;
    if ($("#city").value && c.city !== $("#city").value) return false;
    if ($("#kind").value && c.kind !== $("#kind").value) return false;
    if ($("#stf").value && statusOf(c) !== $("#stf").value) return false;
    if (!q) return true;
    const hay = [c.name, c.person, c.city, c.kind, c.address, c.note, c.website, (c.phones || []).join(" "),
                 (c.phones || []).join(" ").replace(/\s/g, ""), (c.emails || []).join(" "),
                 entriesFor(id).map((k) => [logs[k].who, logs[k].said, logs[k].next].join(" ")).join(" ")].join(" ").toLowerCase();
    return q.split(/\s+/).every((w) => hay.includes(w));
  }
  function shown() {
    return Object.keys(contacts).filter(matches).sort(byOrder);
  }
  // избраните (★) най-отпред, после поредността (местене с ⠿), после по име
  function byOrder(a, b) {
    const A = contacts[a], B = contacts[b];
    return (B.pick ? 1 : 0) - (A.pick ? 1 : 0) || (A.order ?? 1e9) - (B.order ?? 1e9) || (A.name || "").localeCompare(B.name || "", "bg");
  }

  // ---------- изглед ----------
  function renderFilters() {
    const cities = [...new Set(Object.values(contacts).map((c) => c.city).filter(Boolean))].sort();
    const cur = $("#city").value;
    $("#city").innerHTML = '<option value="">Всички</option>' + cities.map((c) => `<option${c === cur ? " selected" : ""}>${esc(c)}</option>`).join("");
    $("#cityList").innerHTML = cities.map((c) => `<option value="${esc(c)}">`).join("");
  }
  function renderTabs() {
    const ids = Object.keys(contacts), rem = openSteps(), fu = followUps().length;
    const over = rem.filter((k) => logs[k].due && logs[k].due <= today()).length + fu;
    $("#nAll").textContent = ids.filter((i) => !isInq(contacts[i])).length;
    $("#nInq").textContent = ids.filter((i) => isInq(contacts[i])).length;
    $("#nPick").textContent = ids.filter((i) => contacts[i].pick).length;
    $("#nRem").textContent = over ? over + " за днес" : rem.length;
    $("#nRem").classList.toggle("over", !!over);
    document.querySelectorAll(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.tab === tab)));
  }

  // последната написана бележка – от разговорите или от полето „Бележка“ (без автоматичните записи за имейла)
  function lastNote(id) {
    const c = contacts[id];
    const k = entriesFor(id).find((x) => { const e = logs[x]; return (e.said || e.next) && !/^Изпратен представителен имейл/.test(e.said || ""); });
    const e = k ? logs[k] : null;
    const fromLog = e ? {at: e.at || "", text: [e.said, e.next ? "Следваща стъпка: " + e.next : ""].filter(Boolean).join("\n"), what: e.kind || "Разговор"} : null;
    const fromNote = c.note ? {at: c.noteAt || c.created || "", text: c.note, what: "Бележка"} : null;
    if (!fromLog) return fromNote;
    if (!fromNote) return fromLog;
    return fromNote.at > fromLog.at ? fromNote : fromLog;
  }
  function thoughtHtml(id) {
    const n = lastNote(id);
    if (!n) return "";
    return `<span class="thought" tabindex="0" aria-label="Последна бележка">💭<span class="bubble" role="tooltip"><b>${esc(n.what)}${n.at ? " · " + esc(fmtAt(n.at).slice(0, 10)) : ""}</b>${esc(n.text)}</span></span>`;
  }
  function rowHtml(id, i) {
    const c = contacts[id], st = statusOf(c), due = nextDue(id), last = lastTalk(id);
    const w = whenText(lastAction(id));
    return `<button class="row${st === "Чака да изпратим имейл" ? " mail-due" : st === "Уговорена среща" ? " meet-due" : ""}" type="button" data-open="${esc(id)}" aria-current="${id === current}">
      <span class="when" title="Последно действие: ${esc(w.long)}"><small>последно</small>${esc(w.short)}</span>
      <span class="star" data-star="${esc(id)}" role="button" aria-pressed="${!!c.pick}" title="Избран" aria-label="Избран">★</span>
      <span class="nm">${readOnly ? "" : `<span class="grip" data-grip="${esc(id)}" title="Хвани и премести нагоре или надолу" aria-label="Премести">⠿</span>`}${i === undefined ? "" : `<span class="no">${i + 1}.</span> `}${esc(c.name)}</span>
      <span class="chipwrap"><span class="chip" style="background: var(${ST_BG[st]})">${esc(st)}${st === "Изпратен имейл" && c.emailSent ? " · " + esc(fmtDay(c.emailSent).slice(0, 5)) : ""}</span>${thoughtHtml(id)}</span>
      <span class="sub">${c.city ? `<span>${esc(c.city)}</span>` : ""}${c.kind ? `<span>${esc(c.kind)}</span>` : ""}
        ${(c.phones || [])[0] ? `<span class="ph">${esc(c.phones[0])}</span>` : ""}</span>
      ${readOnly ? "" : confirmDel === "r:" + id
        ? `<span class="rowdel-ask">Да изтрия ли „${esc(c.name)}“? <span class="mini danger" role="button" data-rowdelyes="${esc(id)}">Да, изтрий</span> <span class="mini" role="button" data-rowdelno="1">Не</span></span>`
        : `<span class="rowdel" role="button" data-rowdel="${esc(id)}" title="Изтрий контакта" aria-label="Изтрий контакта">×</span>`}
    </button>`;
  }

  function entryHtml(k, withName) {
    const e = logs[k], c = contacts[e.contact] || {}, over = !e.done && e.due && e.due <= today();
    return `<div class="entry${over ? " over" : ""}${e.done ? " done" : ""}">
      ${withName ? `<div class="line"><button class="mini" type="button" data-open="${esc(e.contact)}">${esc(c.name || "—")}</button>
        ${(c.phones || [])[0] ? `<span class="val">${esc(c.phones[0])}</span>` : ""}</div>` : ""}
      <div class="em"><b>${esc(fmtAt(e.at))}</b>${e.kind ? `<span>${esc(e.kind)}</span>` : ""}${e.who ? `<span>с: ${esc(e.who)}</span>` : ""}</div>
      ${e.said ? `<div class="said">${esc(e.said)}</div>` : ""}
      ${e.next || e.due ? `<div class="nx">Следва: ${esc(e.next || "обаждане")}${e.due ? " · до " + esc(fmtDay(e.due)) : ""}${e.done ? " · ✓ готово" : ""}</div>` : ""}
      ${readOnly ? "" : `<div class="em">${(e.next || e.due) && !e.done ? `<button class="mini" type="button" data-done="${esc(k)}">Готово</button>` : ""}
        ${confirmDel === "log:" + k ? `<span class="confirm">Да изтрия ли записа? <button class="mini" type="button" data-dellog="${esc(k)}">Да, изтрий</button>
          <button class="mini" type="button" data-cancel="1">Не</button></span>` : `<button class="mini" type="button" data-askdellog="${esc(k)}">Изтрий</button>`}</div>`}
    </div>`;
  }

  function profileHtml() {
    const c = contacts[current];
    if (!c) {
      const n = Object.keys(contacts).length;
      return `<p class="empty">${!loaded ? "Контактите се зареждат…" : n ? "Избери контакт от списъка, за да видиш профила му и да запишеш разговор."
        : "Още няма контакти. Натисни „+ Нов контакт“, за да добавиш първия."}</p>`;
    }
    const st = statusOf(c), ents = entriesFor(current);
    const phones = (c.phones || []).map((p) => `<div class="line"><span class="val">${esc(p)}</span>
      <a class="mini" href="tel:${esc(p.replace(/\s/g, ""))}" target="_blank" rel="noopener">Обади се</a><button class="mini" type="button" data-copy="${esc(p)}">Копирай</button></div>`).join("");
    const emails = (c.emails || []).map((m) => `<div class="line"><span class="val">${esc(m)}</span>
      ${appBtn(m)}<a class="mini" href="https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(m)}" target="_blank" rel="noopener">${IOS || ANDROID ? "Gmail в браузър" : "Gmail"}</a><button class="mini" type="button" data-copy="${esc(m)}">Копирай</button></div>`).join("");
    const site = c.website ? `<div class="line"><a href="${esc(c.website)}" target="_blank" rel="noopener">${esc(c.website.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, ""))}</a></div>` : "";
    return `
      <button class="btn back" type="button" data-back="1">← Към списъка</button>
      <div class="phead">
        <button class="star" type="button" data-star="${esc(current)}" aria-pressed="${!!c.pick}" title="Избран" aria-label="Избран" style="font-size:24px">★</button>
        <div><h2>${esc(c.name)}</h2>
          <div class="meta">${c.kind ? `<span>${esc(c.kind)}</span>` : ""}${c.city ? `<span>${esc(c.city)}</span>` : ""}${c.person ? `<span>Лице: ${esc(c.person)}</span>` : ""}
            <span>Последно действие: <b>${esc(whenText(lastAction(current)).long)}</b></span></div></div>
      </div>
      ${mailDays(c) != null && mailDays(c) >= FOLLOW_DAYS ? `<div class="confirm">Имейлът е изпратен на ${esc(fmtDay(c.emailSent))} – ${mailDays(c)} дни без отговор. Потърси ги пак и запиши разговора.</div>` : ""}
      <div class="lines">${phones}${emails}${site}${c.address ? `<div class="meta">${esc(c.address)}</div>` : ""}</div>
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}
      <div class="status-row">
        <label for="p-status">Статус<select id="p-status" ${readOnly ? "disabled" : ""}>${STATUSES.map((s) => `<option${s === st ? " selected" : ""}>${esc(s)}</option>`).join("")}</select></label>
        ${st === "Изпратен имейл" ? `<label for="p-mail" style="flex:0 1 180px">Имейлът е изпратен на<input type="date" id="p-mail" value="${esc(c.emailSent || "")}" ${readOnly ? "disabled" : ""}></label>` : ""}
        ${readOnly ? "" : `<button class="btn" type="button" data-edit="1">Редактирай</button>`}
        ${readOnly || !(c.emails || []).length ? "" : `<button class="btn primary" type="button" data-mailtpl="1">✉ Представителен имейл</button>`}
        ${readOnly ? "" : confirmDel === "c:" + current ? `<span class="confirm">Да изтрия ли контакта и дневника му?
          <button class="mini" type="button" data-delcontact="1">Да, изтрий</button><button class="mini" type="button" data-cancel="1">Не</button></span>`
          : `<button class="btn danger" type="button" data-askdel="1">Изтрий</button>`}
      </div>
      ${mailOpen === current ? mailPanel(c) : ""}
      ${readOnly ? "" : `<section>
        <h3>Запиши разговор</h3>
        <div class="form" id="logForm">
          <label class="short" for="l-kind">Вид<select id="l-kind">${LOG_KINDS.map((k) => `<option>${k}</option>`).join("")}</select></label>
          <label for="l-who">С кого говорих<input id="l-who" autocomplete="off" value="${esc(c.person ? split(c.person)[0] : "")}"></label>
          <label class="wide" for="l-said">Какво се разбрахме<textarea id="l-said" rows="3" placeholder="напр. проектират 2 жилищни сгради в Тракия, фасадата се решава през януари, искат мостри"></textarea></label>
          <label for="l-next">Следваща стъпка<input id="l-next" autocomplete="off" placeholder="напр. среща в офиса, мостри, оферта"></label>
          <label class="short" for="l-due">До кога<input type="date" id="l-due"></label>
          <div class="actions"><button class="btn primary" type="button" data-addlog="1">Запази разговора</button><span class="msg" id="logMsg"></span></div>
        </div>
      </section>`}
      <section>
        <h3>Дневник${ents.length ? ` (${ents.length})` : ""}</h3>
        <div class="log">${ents.length ? ents.map((k) => entryHtml(k, false)).join("") : `<p class="meta">Още няма записани разговори.</p>`}</div>
      </section>`;
  }

  function renderList() {
    if (tab === "rem") {
      const keys = openSteps().filter((k) => { const q = $("#q").value.trim().toLowerCase(); const e = logs[k];
        return !q || [contacts[e.contact].name, e.who, e.said, e.next].join(" ").toLowerCase().includes(q); });
      const fu = followUps();
      $("#count").textContent = `${keys.length} отворени следващи стъпки` + (fu.length ? ` · ${fu.length} имейла без отговор` : "");
      const fuHtml = fu.map((i) => { const c = contacts[i];
        return `<div class="entry over"><div class="line"><button class="mini" type="button" data-open="${esc(i)}">${esc(c.name)}</button>
          ${(c.phones || [])[0] ? `<span class="val">${esc(c.phones[0])}</span>` : ""}</div>
          <div class="nx">Имейл на ${esc(fmtDay(c.emailSent))} – ${mailDays(c)} дни без отговор. Потърси пак.</div></div>`; }).join("");
      $("#list").innerHTML = keys.length || fu.length ? fuHtml + keys.map((k) => entryHtml(k, true)).join("")
        : `<p class="empty">Няма отворени стъпки. Запиши разговор със „Следваща стъпка“ и дата – ще се появи тук.</p>`;
      return;
    }
    const ids = shown();
    const total = Object.keys(contacts).filter((i) => tab === "inq" ? isInq(contacts[i]) : tab === "all" ? !isInq(contacts[i]) : true).length;
    $("#count").textContent = `Показани ${ids.length} от ${total} ${tab === "inq" ? "запитвания" : "контакта"}`;
    $("#list").innerHTML = ids.length ? ids.map(rowHtml).join("") :
      `<p class="empty">${!loaded ? "Контактите се зареждат…" : Object.keys(contacts).length ? "Няма контакти с тези филтри." : "Още няма контакти. Натисни „+ Нов контакт“."}</p>`;
  }
  function renderProfile() {
    // не пипаме формите (разговор, имейл), докато се пише в тях
    const a = document.activeElement;
    if (a && a.matches && a.matches("input,textarea,select") && (a.closest("#logForm") || a.closest("#mailbox")) && contacts[current]) return;
    captureDraft();
    $("#profile").innerHTML = profileHtml();
    if (mailOpen === current) refreshPreview();
  }
  function render() { renderTabs(); renderList(); renderProfile(); $("#main").classList.toggle("showing", !!contacts[current] && narrowShow); }
  let narrowShow = false;

  // ---------- запис ----------
  function note(text, err) { const el = $("#saveNote"); el.textContent = text; el.classList.toggle("warn", !!err); }
  function fail(e, where) {
    const t = e && e.code === "invalid_argument" ? "Нямате право да записвате тук." : e && e.code === "quota_exceeded" ? "Базата е пълна – не е записано."
      : "Не е записано – опитайте пак след малко.";
    if (where) { where.textContent = t; where.classList.add("err"); } else note(t, true);
    if (e && e.code === "invalid_argument") { readOnly = true; render(); }
  }
  function persistLocal() { store.set("phomi-c-contacts", JSON.stringify(contacts)); store.set("phomi-c-log", JSON.stringify(logs)); }
  const pending = {};
  function saveContact(id, patch) {
    contacts[id] = Object.assign({}, contacts[id], patch, {updated: new Date().toISOString()});
    render();
    if (mode === "local") { persistLocal(); return Promise.resolve(); }
    if (!db || readOnly) return Promise.resolve();
    const body = contacts[id];
    pending[id] = (pending[id] || Promise.resolve()).then(() => db.doc("contacts/" + id).set(body)).catch((e) => fail(e));
    return pending[id];
  }

  function openDialog(id) {
    editing = id || null;
    const c = id ? contacts[id] : tab === "inq" ? {kind: "Клиент", city: ""} : {kind: "Архитект", city: $("#city").value || "Пловдив"};
    $("#dlgTitle").textContent = id ? "Редактирай контакт" : "Нов контакт";
    $("#f-name").value = c.name || ""; $("#f-kind").value = c.kind || "Друго"; $("#f-city").value = c.city || "";
    $("#f-person").value = c.person || ""; $("#f-phones").value = (c.phones || []).join(", ");
    $("#f-emails").value = (c.emails || []).join(", "); $("#f-site").value = c.website || "";
    $("#f-address").value = c.address || ""; $("#f-note").value = c.note || "";
    $("#formMsg").textContent = "";
    try { $("#contactDlg").showModal(); } catch (e) { $("#contactDlg").setAttribute("open", ""); }
    $("#f-name").focus();
  }
  $("#contactForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const name = $("#f-name").value.trim();
    if (!name) { $("#formMsg").textContent = "Напиши името на фирмата."; $("#formMsg").classList.add("err"); return; }
    let site = $("#f-site").value.trim();
    if (site && !/^https?:\/\//.test(site)) site = "https://" + site;
    const patch = {name, kind: $("#f-kind").value, city: $("#f-city").value.trim(), person: $("#f-person").value.trim(),
                   phones: split($("#f-phones").value), emails: split($("#f-emails").value), website: site,
                   address: $("#f-address").value.trim(), note: $("#f-note").value.trim()};
    const id = editing || "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    if (!editing) Object.assign(patch, {status: "Не е звъняно", pick: false, created: new Date().toISOString(), source: "добавен ръчно"},
      tab === "inq" ? {group: "inq"} : {});
    // промяна в бележката се брои за последно действие
    else if ((contacts[editing].note || "") !== patch.note) patch.noteAt = new Date().toISOString();
    current = id; store.set("phomi-c-current", id); narrowShow = true;
    $("#contactDlg").close();
    saveContact(id, patch).then(() => note(editing ? "Контактът е обновен." : "Контактът е добавен."));
    renderFilters();
  });

  // ---------- представителен имейл (шаблон PHOMI, изпраща се през Gmail на зрителя) ----------

le=\"padding:0 32px 6px 32px\">\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n<tr>\n<td width=\"50%\" style=\"padding:0 6px 10px 0\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tr><td bgcolor=\"#007F8B\" style=\"background-color:#007F8B;border-radius:4px\"><a href=\"https://www.phomi.bg/nov-katalozi-2026\" style=\"display:block;background-color:#007F8B;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;text-align:center;padding:12px 8px;border-radius:4px\">Каталози 2026<\/a><\/td><\/tr><\/table><\/td>\n<td width=\"50%\" style=\"padding:0 0 10px 6px\"><table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tr><td bgcolor=\"#007F8B\" style=\"background-color:#007F8B;border-radius:4px\"><a href=\"https://cdn.prod.website-files.com/6971ee37d077eeeff8238dd7/6aba35ed3ddd713780d6df3b_PHOMI-Cenorazpis-EUR-2026.pdf\" style=\"display:block;background-color:#007F8B;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;text-align:center;padding:12px 8px;border-radius:4px\">Ценоразпис<\/a><\/td><\/tr><\/table><\/td>\n<\/tr>\n<tr>\n<td width=\"50%\" style=\"padding:0 6px 10px 0\"><a href=\"https://drive.google.com/drive/folders/1oeSXggnm4eGaXYEbMHVYJiINEwak878v\" style=\"display:block;background-color:#ffffff;color:#007F8B;text-decoration:none;font-size:14px;font-weight:700;text-align:center;padding:11px 8px;border-radius:4px;border:1px solid #007F8B\">Сертификати и документи<\/a><\/td>\n<td width=\"50%\" style=\"padding:0 0 10px 6px\"><a href=\"https://www.phomi.bg/nov-proekti\" style=\"display:block;background-color:#ffffff;color:#007F8B;text-decoration:none;font-size:14px;font-weight:700;text-align:center;padding:11px 8px;border-radius:4px;border:1px solid #007F8B\">Реализирани проекти<\/a><\/td>\n<\/tr>\n<\/table>\n<p style=\"margin:2px 0 0 0;font-size:12px;line-height:18px;color:#6b7678\">Цените са базови, в EUR/м² без ДДС. Доставка, лепило и монтаж се калкулират отделно.<\/p>\n<\/td><\/tr>\n<tr><td style=\"padding:20px 32px 6px 32px;font-size:15px;line-height:23px\">\n<p style=\"margin:0 0 8px 0;font-weight:700\">Имате ли проект, за който търсите подобна визия?<\/p>\n<p style=\"margin:0 0 18px 0\">Изпратете ми снимка или чертеж, за да обсъдим подходящите модели. Можете да видите текстурите и мострите на живо в <a href=\"https://www.phomi.bg/nov-kontakti\" style=\"color:#007F8B;font-weight:700\">шоурумите ни в София и Пловдив<\/a>.<\/p>\n<\/td><\/tr>\n<tr><td style=\"padding:6px 32px 28px 32px;font-size:14px;line-height:21px;border-top:1px solid #e3e8e8\">\n<p style=\"margin:16px 0 0 0\">Поздрави,<br><b>{{SENDER_NAME}}<\/b><br>PHOMI България<br>\n<span style=\"color:#007F8B;font-weight:700\">{{SENDER_EMAIL}} · {{SENDER_PHONE}}<\/span><br>\n<a href=\"https://www.phomi.bg/\" style=\"color:#007F8B\">phomi.bg<\/a><\/p>\n<\/td><\/tr>\n<\/table>\n<\/td><\/tr>\n<\/table>\n<\/div>";

  function firstName(c) {

  const MAIL_QUEUE = "[PHOMI-MAIL]";
  function scriptHtml(v) {
    const teal = "#007F8B", e = (x) => esc(x);
    const link = (t) => `<span style="color:${teal};font-weight:700;text-decoration:underline">${t}</span>`;
    const p = (t) => `<p style="margin:0 0 14px 0;font-weight:700">${t}</p>`;
    return `<div style="background:#f2f4f4;padding:20px 10px;font-family:Arial,Helvetica,sans-serif;color:#1d2526">
      <div style="max-width:600px;margin:0 auto;background:#fff">
      <div style="text-align:center;padding:24px 24px 6px"><img src="${MAIL_LOGO}" alt="PHOMI" style="width:180px;height:auto"></div>
      <div style="text-align:center;font-size:21px;font-weight:700;padding:4px 24px 16px">PHOMI за вашите проекти</div>
      <img src="${MAIL_HERO}" alt="Фасада с PHOMI" style="display:block;width:100%;height:auto">
      <div style="padding:22px 28px 4px;font-size:15px;line-height:23px">
      <p style="margin:0 0 14px 0;font-weight:700;color:${teal}">${e(v.greeting)}</p>${p(e(v.opener))}
      ${p("Визия на камък, дърво или бетон. Тънка и лека минерална облицовка с дебелина около 3–4 мм и тегло около 4 кг/м².")}
      ${p("PHOMI е изцяло натурален и екологичен материал, изработен от кварцов пясък и глина. PHOMI eCovering дава свобода при оформянето на фасади и интериори: разнообразни текстури и формати, ниско тегло и решения за прави и извити повърхности.")}
      ${p("Монтажът е изключително лесен: облицовката се залепва с циментово лепило към подготвената фасада. Материалът е UV защитен, удароустойчив и мразоустойчив, с клас на реакция на огън A1 или A2 според модела. Предлага се с 10-годишна гаранция и експлоатационен живот над 50 години според проведените тестове.")}</div>
      <div style="text-align:center;font-size:15px;line-height:26px;padding:0 24px">${link("Каталог eCovering 2026")} | ${link("Ценоразпис")}<br>${link("Сертификати и технически документи")} | ${link("Реализирани проекти")}</div>
      <div style="text-align:center;font-size:12px;font-weight:700;color:#4b5658;padding:8px 24px">Цените са базови, в EUR/м² без ДДС. Доставка, лепило и монтаж се калкулират отделно.</div>
      <div style="padding:16px 28px 4px;font-size:15px;line-height:23px">${p("Имате ли проект, за който търсите подобна визия?")}${p("Изпратете ми снимка или чертеж, за да обсъдим подходящите модели. Можете да видите текстурите и мострите на живо в " + link("шоурумите ни в София и Пловдив") + ".")}</div>
      <div style="padding:14px 28px 24px;font-size:14px;line-height:21px;border-top:1px solid #e3e8e8">Поздрави,<br><b>${e(v.name || "PHOMI България")}</b><br>PHOMI България<br><span style="color:${teal};font-weight:700">info@phomi.bg · ${e(v.phone || "+359 884 30 30 70")}</span><br>${link("phomi.bg")}</div>
      </div></div>`;
  }
  // често сгрешени домейни – имейлът към тях не стига
  function badDomain(addr) {
    const dom = String(addr || "").split("@")[1] || "";
    const typos = {"gmial.com": "gmail.com", "gmai.com": "gmail.com", "gmal.com": "gmail.com", "gamil.com": "gmail.com", "gnail.com": "gmail.com",
      "gmail.co": "gmail.com", "gmail.con": "gmail.com", "gmail.bg": "gmail.com", "abv.bgb": "abv.bg", "abv.gb": "abv.bg", "abv.com": "abv.bg", "yahoo.co": "yahoo.com"};
    return typos[dom.toLowerCase()] ? "@" + dom + " вместо @" + typos[dom.toLowerCase()] : "";
  }
  function mailPanel(c) {
    const s = sender(), fn = firstName(c), d = mailDraft || {};
    return `<section class="mailbox" id="mailbox">
      <h3>Представителен имейл</h3>
      <div class="form">
        <label for="m-to">До<select id="m-to">${(c.emails || []).map((m) => `<option${m === d.to ? " selected" : ""}>${esc(m)}</option>`).join("")}</select></label>
        <label for="m-open">Начало<select id="m-open"><option value="interest">Благодаря за интереса…</option><option value="call"${d.open === "call" ? " selected" : ""}>Както се разбрахме по телефона…</option></select></label>
        <label class="wide" for="m-greet">Обръщение<input id="m-greet" value="${esc(d.greet ?? (fn ? "Здравейте, " + fn + "," : "Здравейте,"))}" autocomplete="off"></label>
        <label for="m-name">Подпис – име<input id="m-name" value="${esc(d.name ?? s.name ?? "")}" placeholder="напр. Станислав Каадан" autocomplete="off"></label>
        <label for="m-phone">Подпис – телефон<input id="m-phone" value="${esc(d.phone ?? s.phone ?? "+359 884 30 30 70")}" autocomplete="off"></label>
      </div>
      <p class="meta">Тема: „${esc(MAIL_SUBJECT)}“ · ${mailerUrl ? "изпраща се от Gmail на info@phomi.bg с твоя дизайн – тръгва до 1 минута след натискането."
        : "изпраща се през Gmail конектора на Claude – без снимка. За твоя дизайн свържи скрипта (виж по-долу)."}</p>
      ${mailerUrl ? "" : `<details><summary>Свържи скрипта за твоя дизайн</summary><div class="form" style="padding-top:8px">
        <label class="wide" for="m-url">Адрес на скрипта (https://script.google.com/macros/s/…/exec)<input id="m-url" autocomplete="off"></label>
        <button class="btn" type="button" data-mailurl="1">Запази</button></div></details>`}
      <iframe id="m-preview" title="Преглед на имейла" sandbox=""></iframe>
      <div class="actions">
        ${mailBusy === "confirm" && badDomain(d.to || (c.emails || [])[0]) ? `<p class="msg err">Внимание: адресът изглежда сгрешен (${esc(badDomain(d.to || (c.emails || [])[0]))}). Поправи го от „Редактирай“, иначе имейлът няма да стигне.</p>` : ""}
        ${mailBusy === "confirm" ? `<span class="confirm">Да изпратя ли имейла до <b>${esc(d.to || (c.emails || [])[0])}</b>?
            ${mailerUrl && !mcp ? `<a class="btn primary" href="${esc(viaScriptUrl(c, d))}" target="_blank" rel="noopener" data-mailscript="1">Да, изпрати</a>
              <button class="btn" type="button" data-copy="${esc(viaScriptUrl(c, d))}">Копирай линка</button>
              <small class="meta">Ако не се отвори браузър: „Копирай линка“ и го постави в Safari/Chrome – имейлът тръгва веднага.</small>`
              : `<button class="btn primary" type="button" data-mailsend="1">Да, изпрати</button>`}
            <button class="btn" type="button" data-mailcancel="1">Не</button></span>`
          : `<button class="btn primary" type="button" data-mailask="1" ${mailBusy ? "disabled" : ""}>Изпрати</button>
             <button class="btn" type="button" data-mailclose="1">Затвори</button>`}
        <span class="msg" id="m-msg"></span>
      </div>
    </section>`;
  }
  function captureDraft() {
    if (!$("#mailbox")) return;
    mailDraft = {to: $("#m-to").value, open: $("#m-open").value, greet: $("#m-greet").value, name: $("#m-name").value, phone: $("#m-phone").value};
  }
  function refreshPreview() {
    const f = $("#m-preview");
    if (f) f.srcdoc = '<!doctype html><meta charset="utf-8"><body style="margin:0">' + (mailerUrl ? scriptHtml(mailValues()) : fillMail(mailValues())) + "</body>";
  }
  function mailFail(e) {
    const code = e && e.code;
    if (code === "server_not_connected") return "Gmail не е свързан с вашия Claude. Свържете го от claude.ai → Settings → Connectors и опитайте пак.";
    if (code === "needs_reauth") return "Връзката с Gmail е изтекла. Свържете Gmail отново от claude.ai → Settings → Connectors.";
    if (code === "approval_required") return "Трябва да разрешите на страницата да ползва Gmail – отворете я в claude.ai и разрешете, когато ви попита.";
    if (code === "not_in_manifest" || code === "capability_disabled") return "Изпращането не е налично в тази версия на страницата.";
    if (code === "blocked_by_policy") return "Изпращането е спряно от настройките на организацията.";
    if (code === "server_unavailable" || code === "upstream_error")
      return "Не е ясно дали имейлът тръгна – проверете папка „Изпратени“ в Gmail, преди да пробвате отново.";
    if (code === "tool_error") return "Gmail отказа: " + (e.message || "неизвестна грешка");
    return "Не успях да изпратя имейла" + (e && e.message ? ": " + e.message : ".");
  }
  function recordMailed(id, to) {
    const now = new Date().toISOString(), due = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
    saveContact(id, {status: "Изпратен имейл", statusAt: now, emailSent: today()});
    const entry = {contact: id, kind: "Имейл", who: to, said: "Изпратен представителен имейл (каталози, ценоразпис, сертификати, проекти).",
                   next: "Да провериш за отговор", due, done: false, at: now};
    if (mode === "local") { logs["l" + Date.now()] = entry; persistLocal(); render(); }
    else if (db && !readOnly) db.collection("log").add(entry).catch((e) => fail(e));
  }
  // без връзка с Gmail (напр. в приложението на телефона): линк към скрипта, отваря се в браузъра и праща веднага
  function viaScriptUrl(c, d) {
    const fn = firstName(c), s = sender();
    const q = new URLSearchParams({key: MAILER_KEY, to: d.to || (c.emails || [])[0] || "", opener: d.open || "interest",
      greeting: d.greet ?? (fn ? "Здравейте, " + fn + "," : "Здравейте,"), sname: d.name ?? s.name ?? "", sphone: d.phone ?? s.phone ?? "+359 884 30 30 70"});
    return mailerUrl + (mailerUrl.includes("?") ? "&" : "?") + q.toString();
  }
  async function sendMail() {
    captureDraft();
    const v = mailValues(), id = current, msg = () => $("#m-msg"), opener = (mailDraft && mailDraft.open) || "interest";
    store.set("phomi-sender", JSON.stringify({name: v.name, phone: v.phone}));
    if (!v.to) { mailBusy = false; renderProfile(); return; }
    if (!mcp) { mailBusy = false; renderProfile(); refreshPreview(); msg().textContent = "Изпращането не е налично тук – отворете страницата в claude.ai."; msg().classList.add("err"); return; }
    mailBusy = "sending"; renderProfile(); refreshPreview(); msg().textContent = "Изпращане…";
    try {
      // със свързан скрипт: заявка до info@phomi.bg, скриптът я поема до минута и праща имейла с дизайна и снимките
      if (mailerUrl) await mcp.callTool("Gmail", "send_message", {to: ["info@phomi.bg"], subject: MAIL_QUEUE + " " + v.to,
        body: "Служебна заявка от „PHOMI контакти“ – не я пипайте, скриптът праща имейла до " + v.to + " и я изтрива до минута.\n\n<<<" + JSON.stringify({key: MAILER_KEY, to: v.to, greeting: v.greeting, opener, sname: v.name, sphone: v.phone}) + ">>>"});
      else await mcp.callTool("Gmail", "send_message", {to: [v.to], subject: MAIL_SUBJECT, htmlBody: fillMail(v), body: mailText(v)});
      mailBusy = false; mailOpen = null; mailDraft = null;
      recordMailed(id, v.to);
      note(mailerUrl ? "Имейлът до " + v.to + " тръгва от info@phomi.bg до 1 минута." : "Имейлът е изпратен до " + v.to + ".");
      renderProfile();
    } catch (e) {
      mailBusy = false; renderProfile(); refreshPreview();
      msg().textContent = mailFail(e); msg().classList.add("err");
    }
  }

  function addLog() {
    const val = (s) => ($(s) ? $(s).value.trim() : "");
    const body = {contact: current, kind: val("#l-kind"), who: val("#l-who"), said: val("#l-said"), next: val("#l-next"),
                  due: val("#l-due"), done: false, at: new Date().toISOString()};
    const msg = $("#logMsg");
    if (!body.said && !body.next && !body.due) { msg.textContent = "Напиши какво се разбрахте или следващата стъпка."; msg.classList.add("err"); return; }
    // статусът се вдига сам, ако още е „Не е звъняно“
    const c = contacts[current];
    if (statusOf(c) === "Не е звъняно") saveContact(current, {status: body.kind === "Среща" ? "Проведена среща" : "Разговор – интерес"});
    if (mode === "local") { logs["l" + Date.now()] = body; persistLocal(); document.activeElement.blur(); render(); return; }
    if (!db || readOnly) return;
    msg.textContent = "Запазване…"; msg.classList.remove("err");
    db.collection("log").add(body).then(() => { document.activeElement && document.activeElement.blur(); renderProfile(); note("Разговорът е записан."); })
      .catch((e) => fail(e, msg));
  }
  function changeLog(k, del) {
    if (mode === "local") { if (del) delete logs[k]; else logs[k].done = true; persistLocal(); confirmDel = null; render(); return; }
    if (!db || readOnly) return;
    confirmDel = null;
    (del ? db.doc("log/" + k).delete() : db.doc("log/" + k).update({done: true})).catch((e) => fail(e));
  }
  function deleteContact(id) {
    const ks = entriesFor(id);
    const wasOpen = current === id;
    confirmDel = null; if (wasOpen) narrowShow = false;
    if (mode === "local") { delete contacts[id]; ks.forEach((k) => delete logs[k]); persistLocal(); if (wasOpen) current = ""; render(); return; }
    if (!db || readOnly) return;
    if (wasOpen) current = "";
    Promise.all([db.doc("contacts/" + id).delete(), ...ks.map((k) => db.doc("log/" + k).delete())])
      .then(() => note("Контактът е изтрит.")).catch((e) => fail(e));
  }

  function copy(text, btn) {
    const ok = () => { if (btn) { const t = btn.textContent; btn.textContent = "Копирано"; setTimeout(() => { btn.textContent = t; }, 1400); } };
    try { navigator.clipboard.writeText(text).then(ok, () => { $("#bulkMsg").textContent = text; }); } catch (e) { $("#bulkMsg").textContent = text; }
  }
  function copyAll(kind) {
    const ids = tab === "rem" ? [...new Set(openSteps().map((k) => logs[k].contact))] : shown();
    const vals = [...new Set(ids.flatMap((i) => (kind === "mail" ? contacts[i].emails : contacts[i].phones) || []))];
    if (!vals.length) { $("#bulkMsg").textContent = "Няма какво да се копира."; return; }
    const text = vals.join(kind === "mail" ? ", " : "\n");
    try { navigator.clipboard.writeText(text).then(() => { $("#bulkMsg").textContent = `Копирани ${vals.length} ${kind === "mail" ? "имейла" : "телефона"}.`; },
      () => { $("#bulkMsg").textContent = text; }); } catch (e) { $("#bulkMsg").textContent = text; }
  }

  // ---------- събития ----------
  // ---------- местене на редовете с мишката / пръста (хваща се за ⠿) ----------
  let drag = null, dragEndAt = 0;
  document.addEventListener("pointerdown", (ev) => {
    const g = ev.target.closest && ev.target.closest("[data-grip]");
    if (!g || readOnly) return;
    ev.preventDefault();
    const row = g.closest(".row");
    drag = {id: g.dataset.grip, row, y: ev.clientY};
    row.classList.add("dragging"); document.body.classList.add("reordering");
  });
  document.addEventListener("pointermove", (ev) => {
    if (!drag) return;
    ev.preventDefault();
    const over = document.elementFromPoint(ev.clientX, ev.clientY);
    const target = over && over.closest && over.closest("#list .row");
    if (target && target !== drag.row) {
      const r = target.getBoundingClientRect();
      target.parentNode.insertBefore(drag.row, ev.clientY < r.top + r.height / 2 ? target : target.nextSibling);
      [...$("#list").querySelectorAll(".row .no")].forEach((n, k) => { n.textContent = k + 1 + "."; });
    }
    // автоматично превъртане до ръба на екрана
    const edge = 60;
    if (ev.clientY < edge) window.scrollBy(0, -14); else if (ev.clientY > window.innerHeight - edge) window.scrollBy(0, 14);
  }, {passive: false});
  const endDrag = () => {
    if (!drag) return;
    const moved = drag; drag = null; dragEndAt = Date.now();
    moved.row.classList.remove("dragging"); document.body.classList.remove("reordering");
    saveOrder([...$("#list").querySelectorAll(".row")].map((r) => r.dataset.open));
  };
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
  // новата поредност на показаните се вмъква в общата (скритите от филтъра остават на местата си)
  function saveOrder(newShown) {
    const all = Object.keys(contacts).sort(byOrder);
    const set = new Set(newShown), queue = [...newShown];
    const full = all.map((id) => (set.has(id) ? queue.shift() : id));
    const changed = [];
    full.forEach((id, k) => { if (contacts[id].order !== (k + 1) * 10) { contacts[id] = Object.assign({}, contacts[id], {order: (k + 1) * 10}); changed.push(id); } });
    render();
    if (!changed.length) return;
    if (mode === "local") { persistLocal(); return; }
    if (!db || readOnly) return;
    changed.forEach((id) => { const body = contacts[id];
      pending[id] = (pending[id] || Promise.resolve()).then(() => db.doc("contacts/" + id).set(body)).catch((e) => fail(e)); });
    note("Поредността е запазена.");
  }

  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("[data-rowdel],[data-rowdelyes],[data-rowdelno],[data-star],[data-open],[data-tab],[data-copy],[data-edit],[data-askdel],[data-delcontact],[data-cancel],[data-addlog],[data-mailtpl],[data-mailclose],[data-mailask],[data-mailcancel],[data-mailsend],[data-mailscript],[data-mailurl],[data-done],[data-askdellog],[data-dellog],[data-back],#addBtn,#copyPhones,#copyMails");
    if (!t) return;
    if (t.dataset.rowdel) { ev.stopPropagation(); confirmDel = "r:" + t.dataset.rowdel; renderList(); return; }
    if (t.dataset.rowdelno) { ev.stopPropagation(); confirmDel = null; renderList(); return; }
    if (t.dataset.rowdelyes) { ev.stopPropagation(); deleteContact(t.dataset.rowdelyes); return; }
    if (t.dataset.star) { ev.stopPropagation(); if (readOnly) return; const c = contacts[t.dataset.star]; saveContact(t.dataset.star, {pick: !c.pick}); return; }
    if (t.dataset.tab) { tab = t.dataset.tab; render(); return; }
    if (t.dataset.open && Date.now() - dragEndAt < 400) return;  // току-що преместен ред – не го отваряме
    if (t.dataset.open) { current = t.dataset.open; store.set("phomi-c-current", current); confirmDel = null; narrowShow = true; render();
      if (window.matchMedia("(max-width: 860px)").matches) window.scrollTo({top: 0}); return; }
    if (t.dataset.back) { narrowShow = false; render(); return; }
    if (t.dataset.copy) { copy(t.dataset.copy, t); return; }
    if (t.dataset.edit) { openDialog(current); return; }
    if (t.dataset.askdel) { confirmDel = "c:" + current; renderProfile(); return; }
    if (t.dataset.delcontact) { deleteContact(current); return; }
    if (t.dataset.cancel) { confirmDel = null; render(); return; }
    if (t.dataset.addlog) { addLog(); return; }
    if (t.dataset.mailtpl) { mailOpen = current; mailBusy = false; mailDraft = null; renderProfile(); $("#mailbox").scrollIntoView({block: "nearest"}); return; }
    if (t.dataset.mailclose) { mailOpen = null; mailBusy = false; mailDraft = null; renderProfile(); return; }
    if (t.dataset.mailask) { captureDraft(); mailBusy = "confirm"; renderProfile(); return; }
    if (t.dataset.mailcancel) { mailBusy = false; renderProfile(); refreshPreview(); return; }
    if (t.dataset.mailsend) { sendMail(); return; }
    if (t.dataset.mailscript) {
      // линкът се отваря от браузъра (не спираме клика); тук само отбелязваме изпращането
      const d = mailDraft || {}, id = current, to = d.to || (contacts[id].emails || [])[0];
      store.set("phomi-sender", JSON.stringify({name: d.name || "", phone: d.phone || ""}));
      mailOpen = null; mailBusy = false; mailDraft = null;
      setTimeout(() => { recordMailed(id, to); note("Имейлът до " + to + " се изпраща – потвърждението е в браузъра."); renderProfile(); }, 0);
      return;
    }
    if (t.dataset.mailurl) {
      const u = ($("#m-url").value || "").trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(u)) { $("#m-msg").textContent = "Адресът трябва да е от вида https://script.google.com/macros/s/…/exec"; $("#m-msg").classList.add("err"); return; }
      if (db && !readOnly) db.doc("settings/mailer").set({url: u, updated: new Date().toISOString()}).catch((e) => fail(e));
      mailerUrl = u; renderProfile(); return;
    }
    if (t.dataset.done) { changeLog(t.dataset.done, false); return; }
    if (t.dataset.askdellog) { confirmDel = "log:" + t.dataset.askdellog; render(); return; }
    if (t.dataset.dellog) { changeLog(t.dataset.dellog, true); return; }
    if (t.id === "addBtn") { openDialog(null); return; }
    if (t.id === "copyPhones") { copyAll("phone"); return; }
    if (t.id === "copyMails") { copyAll("mail"); return; }
  });
  document.addEventListener("input", (ev) => {
    if (ev.target.closest && ev.target.closest("#mailbox")) { captureDraft(); refreshPreview(); }
  });
  document.addEventListener("change", (ev) => {
    if (ev.target.id === "p-status" && contacts[current]) {
      const patch = {status: ev.target.value, statusAt: new Date().toISOString()};
      // датата на имейла се записва сама при маркиране; може да се поправи ръчно в профила
      if (ev.target.value === "Изпратен имейл" && statusOf(contacts[current]) !== "Изпратен имейл") patch.emailSent = today();
      saveContact(current, patch);
    }
    if (ev.target.id === "p-mail" && contacts[current] && ev.target.value) saveContact(current, {emailSent: ev.target.value});
  });
  ["#q", "#city", "#kind", "#stf"].forEach((s) => $(s).addEventListener("input", renderList));

  render();

  // ---------- база ----------
  function goLocal() {
    mode = "local"; loaded = true;
    try { Object.assign(contacts, JSON.parse(store.get("phomi-c-contacts") || "{}")); } catch (e) { /* празно */ }
    try { Object.assign(logs, JSON.parse(store.get("phomi-c-log") || "{}")); } catch (e) { /* празно */ }
    note("Записва се само в този браузър (няма връзка с базата).", true);
    renderFilters(); render();
  }
  if (window.claude && typeof window.claude.use === "function") {
    Promise.resolve(window.claude.use("mcp")).then((ns) => { mcp = ns; }).catch(() => { mcp = null; });
  }
  const use = window.claude && typeof window.claude.use === "function" ? window.claude.use("db") : Promise.resolve(null);
  Promise.resolve(use).then((ns) => {
    if (!ns) { goLocal(); return; }
    db = ns; mode = "db";
    const lost = () => note("Връзката с базата прекъсна – презаредете страницата.", true);
    db.collection("contacts").onSnapshot((snap) => {
      snap.docChanges().forEach((ch) => {
        if (ch.type === "removed") delete contacts[ch.doc.id];
        else contacts[ch.doc.id] = Object.assign({}, ch.doc.data());
      });
      if (!loaded) note("Всичко се записва автоматично и се вижда на всичките ви устройства.");
      loaded = true;
      renderFilters(); render();
    }, lost);
    db.doc("settings/mailer").onSnapshot((d) => {
      mailerUrl = (d && d.exists && d.data().url) || "";
      if (mailOpen) renderProfile();
    }, () => {});
    db.collection("log").onSnapshot((snap) => {
      snap.docChanges().forEach((ch) => {
        if (ch.type === "removed") delete logs[ch.doc.id];
        else logs[ch.doc.id] = Object.assign({}, ch.doc.data());
      });
      render();
    }, lost);
  }).catch(goLocal);
})();
</script>
